<title>PhéCompte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone shell (max 560px), sticky header, fixed bottom tab bar, bottom sheets for input. */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface-2:#e9eff2; --ink:#12232e; --muted:#566b78; --line:#d6e0e5;
  --accent:#0d7a70; --accent-ink:#ffffff; --accent-soft:#d5efeb; --sun:#f2b33d; --sun-ink:#3d2a00;
  --low:#2b9a57; --mid:#d98a1f; --high:#cf3f39; --band:#cdeee4;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(18,35,46,.06),0 6px 20px rgba(18,35,46,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c161c; --surface:#14222b; --surface-2:#1b2c36; --ink:#e6eef2; --muted:#93a8b4; --line:#253a46;
  --accent:#3cbcae; --accent-ink:#06201d; --accent-soft:#163a37; --sun:#f5c35e; --sun-ink:#2b1d00;
  --low:#4cc47e; --mid:#f0a845; --high:#f06a62; --band:#173d36; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c161c; --surface:#14222b; --surface-2:#1b2c36; --ink:#e6eef2; --muted:#93a8b4; --line:#253a46;
  --accent:#3cbcae; --accent-ink:#06201d; --accent-soft:#163a37; --sun:#f5c35e; --sun-ink:#2b1d00;
  --low:#4cc47e; --mid:#f0a845; --high:#f06a62; --band:#173d36; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
.shell{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
header.top h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
header.top h1 small{display:block;font:500 .78rem var(--f-body);color:var(--muted);letter-spacing:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 .95rem var(--f-display);overflow:hidden;flex:none;border:0;cursor:pointer;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:64px;height:64px;font-size:1.3rem}
main{display:grid;gap:16px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;display:grid;gap:12px;min-width:0}
.label{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.btn{text-decoration:none;color:inherit}a.btn.primary{color:var(--accent-ink)}
.btn.danger{color:var(--high);border-color:color-mix(in srgb,var(--high) 40%,var(--line))}
.btn.danger.armed{background:var(--high);color:#fff;border-color:var(--high)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.tab:focus-visible,.item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.icon-btn{appearance:none;border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted);line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button b{display:block;font:700 1.05rem var(--f-display);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:600;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:grid;gap:6px;font-weight:600;font-size:.9rem}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:46px}
textarea{min-height:120px;font:13px/1.4 ui-monospace,Menlo,monospace}
.err{color:var(--high);font-size:.86rem;font-weight:600}
.warn{background:color-mix(in srgb,var(--mid) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--mid) 45%,var(--line));border-radius:12px;padding:10px 12px;font-size:.9rem}
.note{background:var(--accent-soft);border-radius:12px;padding:12px;font-size:.92rem}
/* day total */
.total{background:var(--ink);color:var(--bg);border:0;padding:18px}
.total .label{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.total .big{font:800 3.4rem/1 var(--f-display);letter-spacing:-.02em}
.total .big span{font-size:1.1rem;font-weight:600;margin-left:6px;letter-spacing:0}
.bar{height:10px;background:color-mix(in srgb,var(--bg) 18%,var(--ink));border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .3s}
.bar.over i{background:var(--high)}
/* lists */
.list{display:grid}
.item{appearance:none;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);width:100%;cursor:pointer;min-width:0}
.list>.item:first-child,.list>:first-child .item{border-top:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.84rem;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}
.d0{background:var(--low)}.d1{background:var(--mid)}.d2{background:var(--high)}
.cat{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font:700 .8rem var(--f-display)}
.cat.F{background:color-mix(in srgb,var(--mid) 20%,var(--surface));color:var(--mid)}
.cat.L{background:color-mix(in srgb,var(--low) 20%,var(--surface));color:var(--low)}
.cat.C{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent)}
.parts{font:700 1rem var(--f-display);text-align:right;white-space:nowrap}
.parts small{display:block;font:500 .78rem var(--f-body);color:var(--muted)}
.empty{text-align:center;padding:22px 8px;color:var(--muted)}
.letter{font:800 .8rem var(--f-display);color:var(--accent);padding:12px 2px 2px;letter-spacing:.06em}
.legend{display:flex;gap:14px;font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:99px}
.st-in{background:color-mix(in srgb,var(--low) 18%,var(--surface));color:var(--low)}
.st-hi{background:color-mix(in srgb,var(--high) 16%,var(--surface));color:var(--high)}
.st-lo{background:color-mix(in srgb,var(--mid) 18%,var(--surface));color:var(--mid)}
.chart{width:100%;overflow:hidden}
.chart svg{display:block;width:100%}
.chart text{fill:var(--muted);font:11px var(--f-body)}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:9px 2px 8px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg.i{stroke-width:2.4}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,14,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet-h h2{font-size:1.2rem;flex:1}
.sheet-b{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.grams{display:flex;align-items:center;gap:8px}
.grams input{text-align:center;font:800 2rem var(--f-display);min-height:64px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px)}
.recipe h2{font-size:1.6rem}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.facts b{display:block;font:800 1.3rem var(--f-display)}
.facts span{font-size:.78rem;color:var(--muted)}
ol.steps{margin:0;padding-left:1.3em;display:grid;gap:10px;max-width:65ch}
ul.ing{margin:0;padding-left:1.1em;display:grid;gap:4px}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.conv input{font:800 1.6rem var(--f-display);text-align:center;min-height:60px}
.conv .eq{font:700 1.4rem var(--f-display);color:var(--muted);padding-bottom:14px}
table.ref{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.ref td,table.ref th{padding:8px 4px;border-top:1px solid var(--line);text-align:right}
table.ref th{font-size:.78rem;color:var(--muted);text-align:right;border-top:0}
table.ref td:first-child,table.ref th:first-child{text-align:left}
.banner{background:var(--sun);color:var(--sun-ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:.92rem}
.banner .btn{min-height:38px;padding:7px 12px;background:var(--sun-ink);color:var(--sun);border:0}
details summary{cursor:pointer;font-weight:700}
.small{font-size:.85rem}
</style>

<div class="shell">
  <header class="top">
    <h1 id="title">PhéCompte</h1>
    <button class="avatar" id="hdrAvatar" aria-label="Profil"></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Navigation"><div class="in" id="tabs"></div></nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
/*DATA*/
</script>
<script>
"use strict";
const PART_MG = 20, UMOL = 60.54;
const KEY = "phecompte.v1";
const MEALS = [["pdj","Petit déj."],["dej","Déjeuner"],["gouter","Goûter"],["diner","Dîner"]];
const TENEUR = ["Faible","Moyenne","Forte"];
const ICONS = {
  repas:'<path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v6M7 3h4M17 3c-1.7 0-3 2.2-3 5s1.3 4 3 4v9"/>',
  suivi:'<path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/>',
  recettes:'<path d="M6 13.9a4 4 0 1 1 2.9-6.6 5 5 0 0 1 9.3 2A3.5 3.5 0 0 1 18 16H6z"/><path d="M6 16v4h12v-4"/>',
  convertir:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
  profil:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  close:'<path d="M18 6 6 18M6 6l12 12"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'
};
const TABS = [["repas","Repas"],["suivi","Suivi"],["recettes","Recettes"],["convertir","Convertir"],["profil","Profil"]];
const icon = (n, cls="i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d=2) => Number(n).toLocaleString("fr-FR", {maximumFractionDigits:d});
const parseNum = s => { const v = parseFloat(String(s).replace(",", ".").trim()); return isNaN(v) ? NaN : v; };
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const isoAdd = days => { const d = new Date(); d.setDate(d.getDate()+days); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const frDate = iso => { const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; };
const longDate = iso => new Date(iso + "T12:00").toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
const uid = () => Math.random().toString(36).slice(2, 9);
const framed = (() => { try { return window.self !== window.top; } catch(e) { return true; } })();

const FOOD = new Map(ALIMENTS.map(([id, n, w, t, c]) => ["a"+id, {ref:"a"+id, n, w, t, c}]));

/* ---------- storage ---------- */
let storageOK = true;
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); }
  catch(e){ storageOK = false; }
  return null;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; }
  catch(e){ storageOK = false; }
}
function newProfile(prenom){
  return {id:uid(), prenom, nom:"", sexe:"", naissance:"", photo:"", seuilMin:null, seuilMax:null, unit:"mg", objectif:null,
          repas:{pdj:[],dej:[],gouter:[],diner:[]}, custom:[], analyses:[], favoris:[]};
}
function exampleProfile(){
  const p = newProfile("Exemple");
  p.isExample = true; p.seuilMin = 2; p.seuilMax = 6; p.objectif = 18;
  const find = n => [...FOOD.values()].find(f => f.n.toLowerCase().startsWith(n));
  const add = (meal, n, g) => { const f = find(n); if (f) p.repas[meal].push({ref:f.ref, g}); };
  add("pdj","banane",80); add("pdj","fraise",100);
  add("dej","carotte",150); add("dej","tomate",120);
  add("gouter","pomme",120);
  p.custom.push({ref:"c1", n:"Compote pomme-poire (pot)", w:Math.round(100*200/(3.2*0.3))/100, c:"C", lait:false, prot:0.3});
  add("diner","haricot",100);
  p.repas.diner.push({ref:"c1", g:100});
  const vals = [[-160,7.4],[-130,5.1],[-102,4.6],[-75,6.8],[-48,5.4],[-20,3.9],[-5,4.4]];
  p.analyses = vals.map(([d,v]) => ({id:uid(), date:isoAdd(d), mg:v, u:"mg", note: d===-75 ? "Après les vacances" : ""}));
  p.favoris = [0, 1];
  return p;
}
let db = load();
if (!db || !Array.isArray(db.profiles) || !db.profiles.length){ const p = exampleProfile(); db = {profiles:[p], current:p.id}; }
const P = () => db.profiles.find(p => p.id === db.current) || db.profiles[0];

function food(ref, p = P()){
  if (ref.startsWith("a")) return FOOD.get(ref);
  return p.custom.find(c => c.ref === ref) || {ref, n:"Aliment supprimé", w:null, c:"C"};
}
const partsOf = (f, g) => (!f || !f.w) ? 0 : Math.round(100 * g / f.w) / 100;
const mealParts = (p, m) => Math.round(100 * p.repas[m].reduce((s, it) => s + partsOf(food(it.ref, p), it.g), 0)) / 100;
const dayParts = p => Math.round(100 * MEALS.reduce((s, [m]) => s + mealParts(p, m), 0)) / 100;
const toUnit = (mg, u) => u === "mg" ? mg : mg * UMOL;
const unitLabel = u => u === "mg" ? "mg/dL" : "µmol/L";
const fmtVal = (mg, u) => u === "mg" ? fmt(mg, 1) : fmt(Math.round(mg * UMOL), 0);
const initials = p => ((p.prenom||"?")[0] + (p.nom ? p.nom[0] : "")).toUpperCase();
const avatarHTML = (p, lg) => `<span class="avatar${lg?" lg":""}" aria-hidden="true">${p.photo ? `<img src="${esc(p.photo)}" alt="">` : esc(initials(p))}</span>`;
function status(p, mg){
  if (p.seuilMin == null || p.seuilMax == null) return null;
  if (mg > p.seuilMax) return ["st-hi","Au-dessus de la cible"];
  if (mg < p.seuilMin) return ["st-lo","En dessous de la cible"];
  return ["st-in","Dans la cible"];
}

/* ---------- UI state ---------- */
const ui = {tab:"repas", meal:"pdj", range:"6m", recType:"Tout", recQ:"", recIng:[], recipe:null, addCat:"F", search:""};
const hashTabs = TABS.map(t => t[0]);
function route(){ const h = location.hash.slice(1); ui.tab = hashTabs.includes(h) ? h : "repas"; render(); }
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => { if (ui.tab === "suivi") drawChart(); });

function toast(msg){
  const r = document.getElementById("toastRoot");
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 2600);
}
/* two-step confirmation without confirm() */
function armed(btn, label, fn){
  if (btn.dataset.armed){ fn(); return; }
  const orig = btn.innerHTML; btn.dataset.armed = "1"; btn.classList.add("armed"); btn.textContent = label;
  setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.classList.remove("armed"); btn.innerHTML = orig; } }, 4000);
}

function render(){
  const p = P();
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) =>
    `<button class="tab" data-tab="${k}" ${ui.tab===k?'aria-current="page"':""}>${icon(k)}<span>${l}</span></button>`).join("");
  const av = document.getElementById("hdrAvatar");
  av.innerHTML = p.photo ? `<img src="${esc(p.photo)}" alt="">` : esc(initials(p));
  av.setAttribute("aria-label", "Profil de " + p.prenom);
  const titles = {repas:["Parts de Phé", "Calcul de la journée"], suivi:["Suivi sanguin", "Taux de phénylalanine"], recettes:["Recettes","Pauvres en protéines"], convertir:["Convertir","mg/dL ⇄ µmol/L"], profil:["Profil", p.prenom + (p.nom ? " " + p.nom : "")]};
  const [t, s] = titles[ui.tab];
  document.getElementById("title").innerHTML = `${esc(t)}<small>${esc(s)}</small>`;
  const v = document.getElementById("view");
  v.innerHTML = banners(p) + ({repas:viewRepas, suivi:viewSuivi, recettes:viewRecettes, convertir:viewConvertir, profil:viewProfil}[ui.tab])(p);
  if (ui.tab === "suivi") drawChart();
  if (ui.tab === "convertir") bindConv();
}
function banners(p){
  let h = "";
  if (p.isExample) h += `<div class="banner"><span class="grow">Profil d'exemple : ces aliments et résultats sont fictifs.</span><button class="btn" data-act="startReal">Créer mon profil</button></div>`;
  if (!storageOK) h += `<div class="banner"><span class="grow">Ce navigateur n'enregistre pas les données. Exportez une sauvegarde depuis l'onglet Profil.</span></div>`;
  return h;
}

/* ---------- Repas ---------- */
function viewRepas(p){
  const total = dayParts(p);
  let goal = "";
  if (p.objectif){
    const pct = Math.min(100, total / p.objectif * 100), over = total > p.objectif;
    const rest = Math.round(100 * (p.objectif - total)) / 100;
    goal = `<div class="bar${over?" over":""}" role="progressbar" aria-valuemin="0" aria-valuemax="${p.objectif}" aria-valuenow="${total}"><i style="width:${pct}%"></i></div>
      <div class="row small"><span class="grow">Objectif : ${fmt(p.objectif)} parts</span><b>${over ? "Dépassé de " + fmt(-rest) : "Reste " + fmt(rest)} part${Math.abs(rest) > 1 ? "s" : ""}</b></div>`;
  }
  const items = p.repas[ui.meal];
  const list = items.length ? items.map((it, i) => {
    const f = food(it.ref, p), pt = partsOf(f, it.g);
    return `<button class="item" data-act="editItem" data-i="${i}">
      <span class="cat ${f.c}">${f.c === "C" ? "Emb" : f.c === "F" ? "Fr" : "Lég"}</span>
      <span class="grow"><span class="t">${esc(f.n)}</span><br><span class="s num">${fmt(it.g,0)} g${f.w ? " · 1 part = " + fmt(f.w) + " g" : " · sans Phé"}</span></span>
      <span class="parts num">${fmt(pt)}<small>part${pt > 1 ? "s" : ""}</small></span></button>`;
  }).join("") : `<div class="empty">Aucun aliment pour ce repas.<br>Ajoutez ce qui a été mangé pour compter les parts.</div>`;
  const any = MEALS.some(([m]) => p.repas[m].length);
  return `
  <section class="card total" aria-label="Total de la journée">
    <div class="label">Total de la journée</div>
    <div class="big num">${fmt(total)}<span>part${total > 1 ? "s" : ""}</span></div>
    <div class="small num">soit ${fmt(total * PART_MG, 0)} mg de phénylalanine (1 part = ${PART_MG} mg)</div>
    ${goal}
  </section>
  <div class="seg" role="group" aria-label="Repas">${MEALS.map(([m, l]) => `<button data-act="meal" data-m="${m}" aria-pressed="${ui.meal===m}">${l}<b class="num">${fmt(mealParts(p, m))}</b></button>`).join("")}</div>
  <section class="card"><div class="list">${list}</div>
    <button class="btn primary block" data-act="addFood">${icon("plus")}Ajouter un aliment</button>
  </section>
  ${any ? `<button class="btn danger block" data-act="resetDay">Commencer une nouvelle journée</button>` : ""}`;
}

function sheet(title, body, onMount){
  const root = document.getElementById("sheetRoot");
  root.innerHTML = `<div class="scrim" data-act="closeScrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn" data-act="closeSheet" aria-label="Fermer">${icon("close")}</button></div>
    <div class="sheet-b" id="sheetBody">${body}</div></div></div>`;
  onMount && onMount(document.getElementById("sheetBody"));
}
function closeSheet(){ document.getElementById("sheetRoot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function openAddFood(){
  const p = P();
  const cats = [["F","Fruits"],["L","Légumes"],["E","Emballés"],["M","Mes aliments"]];
  const draw = () => {
    let body = `<div class="seg" role="group" aria-label="Type d'aliment">${cats.map(([k,l]) => `<button data-act="addCat" data-c="${k}" aria-pressed="${ui.addCat===k}">${l}</button>`).join("")}</div>`;
    if (ui.addCat === "F" || ui.addCat === "L"){
      const q = ui.search.trim().toLowerCase();
      const rows = [...FOOD.values()].filter(f => f.c === ui.addCat && (!q || f.n.toLowerCase().includes(q))).sort((a, b) => a.n.localeCompare(b.n, "fr"));
      let last = "", list = "";
      for (const f of rows){
        const L = f.n[0].toUpperCase().normalize("NFD")[0];
        if (L !== last && !q){ list += `<div class="letter">${L}</div>`; last = L; }
        list += `<button class="item" data-act="pickFood" data-ref="${f.ref}"><span class="dot d${f.t}" title="Teneur ${TENEUR[f.t]}"></span><span class="grow t">${esc(f.n)}</span><span class="s num">1 part = ${fmt(f.w)} g</span></button>`;
      }
      body += `<input type="search" id="foodSearch" placeholder="Rechercher un ${ui.addCat === "F" ? "fruit" : "légume"}" value="${esc(ui.search)}" autocomplete="off">
        <div class="legend"><span><i class="dot d0"></i>Faible</span><span><i class="dot d1"></i>Moyenne</span><span><i class="dot d2"></i>Forte</span><span>teneur en Phé</span></div>
        <div class="list" id="foodList">${list || `<div class="empty">Aucun résultat pour « ${esc(ui.search)} ».</div>`}</div>`;
    } else if (ui.addCat === "E"){
      body += `<p class="small muted" style="margin:0">Pour un produit du commerce sans aspartame, la part de Phé se calcule à partir des protéines indiquées sur l'étiquette nutritionnelle (pour 100 g).</p>
        <label class="f">Type de produit
          <select id="eLait"><option value="1">Avec lait ou céréales (pommes de terre seules, légumes cuisinés…)</option><option value="0">Sans lait ni céréales (fruits, légumes, avec ou sans pommes de terre)</option></select></label>
        <label class="f">Nom du produit<input type="text" id="eNom" placeholder="Ex. : purée de carottes" maxlength="60"></label>
        <label class="f">Protéines pour 100 g (g)<input type="text" id="eProt" inputmode="decimal" placeholder="Ex. : 0,8"></label>
        <div id="ePrev" class="note num">Saisissez la quantité de protéines.</div>
        <div id="eErr" class="err" role="alert"></div>
        <button class="btn primary block" data-act="saveCustom">Enregistrer et choisir la quantité</button>`;
    } else {
      body += p.custom.length ? `<div class="list">${p.custom.map(c => `<div class="row" style="flex-wrap:nowrap"><button class="item grow" data-act="pickFood" data-ref="${c.ref}"><span class="cat C">Emb</span><span class="grow"><span class="t">${esc(c.n)}</span><br><span class="s num">${c.w ? "1 part = " + fmt(c.w) + " g" : "sans Phé"} · ${c.lait ? "avec" : "sans"} lait</span></span></button><button class="icon-btn" data-act="delCustom" data-ref="${c.ref}" aria-label="Supprimer ${esc(c.n)}">${icon("trash")}</button></div>`).join("")}</div>`
        : `<div class="empty">Les produits emballés que vous ajoutez sont gardés ici pour la prochaine fois.</div>`;
    }
    document.getElementById("sheetBody").innerHTML = body;
    const s = document.getElementById("foodSearch");
    if (s) s.addEventListener("input", () => { ui.search = s.value; const pos = s.selectionStart; draw(); const n = document.getElementById("foodSearch"); n.focus(); n.setSelectionRange(pos, pos); });
    const prot = document.getElementById("eProt"), lait = document.getElementById("eLait");
    if (prot){ const upd = () => { const r = customCalc(); document.getElementById("ePrev").textContent = r.msg; }; prot.addEventListener("input", upd); lait.addEventListener("change", upd); }
  };
  openAddFood.draw = draw;
  sheet("Ajouter au " + MEALS.find(m => m[0] === ui.meal)[1].toLowerCase().replace("déj.", "déjeuner"), "", draw);
}
function customCalc(){
  const lait = document.getElementById("eLait").value === "1";
  const prot = parseNum(document.getElementById("eProt").value);
  const max = lait ? 12 : 5;
  if (isNaN(prot)) return {ok:false, msg:"Saisissez la quantité de protéines.", lait};
  if (prot < 0 || prot > max) return {ok:false, msg:`Pour ce type de produit, la valeur doit être entre 0 et ${max} g. Vérifiez l'étiquette ou le type choisi.`, lait, prot};
  let w = null;
  if (prot > 0) w = lait ? 200 / (5 * prot) : (prot < 0.8 ? 200 / (3.2 * prot) : 200 / (3.8 * prot));
  w = w && Math.round(100 * w) / 100;
  return {ok:true, w, lait, prot, msg: w ? `1 part de Phé = ${fmt(w)} g de ce produit` : "Sans protéines : ce produit ne compte pas de part."};
}

function openWeight(ref, idx){
  const p = P(), f = food(ref, p), editing = idx != null;
  let g = editing ? p.repas[ui.meal][idx].g : 100;
  const mealName = MEALS.find(m => m[0] === ui.meal)[1];
  sheet(f.n, `
    <div class="muted small">${f.w ? `1 part = ${fmt(f.w)} g` : "Sans phénylalanine"}${f.t != null ? " · teneur " + TENEUR[f.t].toLowerCase() : ""}</div>
    <div class="grams"><button class="btn" data-step="-10" aria-label="Moins 10 g">−10</button><input type="text" id="wG" inputmode="decimal" aria-label="Poids en grammes" value="${g}"><button class="btn" data-step="10" aria-label="Plus 10 g">+10</button></div>
    <input type="range" id="wR" min="0" max="500" step="5" value="${Math.min(500, g)}" aria-label="Poids">
    <div class="note row"><span class="grow">Grammes consommés</span><b class="num" id="wP"></b></div>
    <button class="btn primary block" id="wSave">${editing ? "Enregistrer" : "Ajouter au " + mealName.toLowerCase()}</button>
    ${editing ? `<button class="btn danger block" id="wDel">Retirer du repas</button>` : ""}`, b => {
      const gi = b.querySelector("#wG"), r = b.querySelector("#wR"), out = b.querySelector("#wP");
      const upd = () => { const pt = partsOf(f, g); out.textContent = `${fmt(pt)} part${pt > 1 ? "s" : ""} · ${fmt(pt * PART_MG, 0)} mg`; };
      gi.addEventListener("input", () => { const v = parseNum(gi.value); g = isNaN(v) || v < 0 ? 0 : Math.min(5000, v); r.value = Math.min(500, g); upd(); });
      r.addEventListener("input", () => { g = +r.value; gi.value = g; upd(); });
      b.querySelectorAll("[data-step]").forEach(x => x.addEventListener("click", () => { g = Math.max(0, Math.round(g + +x.dataset.step)); gi.value = g; r.value = Math.min(500, g); upd(); }));
      b.querySelector("#wSave").addEventListener("click", () => {
        if (editing) p.repas[ui.meal][idx].g = g; else p.repas[ui.meal].push({ref, g});
        save(); closeSheet(); render(); toast(editing ? "Quantité mise à jour" : `${f.n} ajouté`);
      });
      const del = b.querySelector("#wDel");
      if (del) del.addEventListener("click", () => { p.repas[ui.meal].splice(idx, 1); save(); closeSheet(); render(); toast("Aliment retiré"); });
      upd();
    });
}

/* ---------- Suivi ---------- */
function viewSuivi(p){
  const an = [...p.analyses].sort((a, b) => a.date.localeCompare(b.date));
  const last = an[an.length - 1], u = p.unit;
  const hasSeuil = p.seuilMin != null && p.seuilMax != null;
  const st = last && status(p, last.mg);
  return `
  ${!hasSeuil ? `<div class="card"><b>Définissez votre zone cible</b><span class="small muted">Les seuils minimum et maximum sont fixés avec l'équipe médicale. Ils apparaissent sur le graphique.</span><button class="btn primary" data-act="seuils">Définir les seuils</button></div>` : ""}
  <section class="card">
    <div class="row"><div class="grow"><div class="label">Dernier résultat</div>
      ${last ? `<div style="font:800 2.2rem/1.1 var(--f-display)" class="num">${fmtVal(last.mg, u)} <span style="font-size:1rem;font-weight:600">${unitLabel(u)}</span></div><div class="small muted">Le ${longDate(last.date)}</div>` : `<div class="muted">Aucun résultat enregistré</div>`}
    </div>${st ? `<span class="status ${st[0]}">${st[1]}</span>` : ""}</div>
    <div class="seg" role="group" aria-label="Unité">${["mg","umol"].map(k => `<button data-act="unit" data-u="${k}" aria-pressed="${u===k}">${unitLabel(k)}</button>`).join("")}</div>
  </section>
  <section class="card">
    <div class="row"><div class="label grow">Évolution</div><div class="chips">${[["3m","3 mois"],["6m","6 mois"],["1a","1 an"],["all","Tout"]].map(([k,l]) => `<button class="chip" data-act="range" data-r="${k}" aria-pressed="${ui.range===k}">${l}</button>`).join("")}</div></div>
    <div class="chart" id="chart"></div>
    ${hasSeuil ? `<div class="legend"><span><i class="dot" style="background:var(--band);border:1px solid var(--low)"></i>Zone cible ${fmtVal(p.seuilMin,u)}–${fmtVal(p.seuilMax,u)} ${unitLabel(u)}</span><button class="btn ghost small" data-act="seuils" style="min-height:0;padding:0">Modifier</button></div>` : ""}
  </section>
  <div class="row"><button class="btn primary grow" data-act="addAnalyse">${icon("plus")}Nouveau résultat</button><button class="btn grow" data-act="export" ${an.length ? "" : "disabled"}>Exporter</button></div>
  <section class="card"><div class="label">Historique</div><div class="list">
    ${an.length ? [...an].reverse().map(a => { const s = status(p, a.mg); return `<button class="item" data-act="editAnalyse" data-id="${a.id}">
      <span class="dot ${s ? (s[0]==="st-in" ? "d0" : s[0]==="st-hi" ? "d2" : "d1") : ""}"></span>
      <span class="grow"><span class="t num">${frDate(a.date)}</span>${a.note ? `<br><span class="s">${esc(a.note)}</span>` : ""}</span>
      <span class="parts num">${fmtVal(a.mg, u)}<small>${unitLabel(u)}</small></span></button>`; }).join("") : `<div class="empty">Ajoutez le résultat de votre dernière prise de sang pour commencer le suivi.</div>`}
  </div></section>`;
}
function drawChart(){
  const el = document.getElementById("chart"); if (!el) return;
  const p = P(), u = p.unit;
  const W = Math.max(260, el.clientWidth || 320), H = 210, m = {l:40, r:12, t:12, b:28};
  const an = [...p.analyses].sort((a, b) => a.date.localeCompare(b.date));
  const now = Date.now(), day = 864e5;
  const spans = {"3m":91, "6m":182, "1a":365};
  let x0, x1 = now + 7 * day;
  if (ui.range === "all"){ x0 = an.length ? Math.min(new Date(an[0].date+"T12:00").getTime() - 10*day, now - 30*day) : now - 182*day; }
  else x0 = now - spans[ui.range] * day;
  const pts = an.map(a => ({t:new Date(a.date + "T12:00").getTime(), v:toUnit(a.mg, u), a})).filter(q => q.t >= x0 && q.t <= x1);
  let vmax = Math.max(...pts.map(q => q.v), p.seuilMax != null ? toUnit(p.seuilMax, u) : 0, u === "mg" ? 8 : 480);
  const step = niceStep(vmax / 4); vmax = Math.ceil(vmax * 1.08 / step) * step;
  const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => H - m.b - v / vmax * (H - m.t - m.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Évolution du taux de Phé en ${unitLabel(u)}">`;
  if (p.seuilMin != null && p.seuilMax != null){
    const a = Y(toUnit(p.seuilMax, u)), b = Y(toUnit(p.seuilMin, u));
    s += `<rect x="${m.l}" y="${a}" width="${W - m.l - m.r}" height="${b - a}" fill="var(--band)"/>`;
  }
  for (let v = 0; v <= vmax + 1e-9; v += step){
    const y = Y(v);
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 6}" y="${y + 4}" text-anchor="end">${fmt(v, u === "mg" ? 1 : 0)}</text>`;
  }
  const d0 = new Date(x0); d0.setDate(1); d0.setHours(12);
  const months = (x1 - x0) / day / 30, every = months > 13 ? 3 : months > 7 ? 2 : 1;
  for (let d = new Date(d0), i = 0; d.getTime() <= x1; d.setMonth(d.getMonth() + 1), i++){
    if (d.getTime() < x0 || d.getMonth() % every) continue;
    const x = X(d.getTime());
    s += `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${H - m.b}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${x}" y="${H - 8}" text-anchor="middle">${d.toLocaleDateString("fr-FR", {month:"short"}).replace(".", "")}${d.getMonth() === 0 ? " " + String(d.getFullYear()).slice(2) : ""}</text>`;
  }
  if (pts.length > 1) s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(q => X(q.t) + "," + Y(q.v)).join(" ")}"/>`;
  pts.forEach((q, i) => {
    const st = status(p, q.a.mg), col = !st ? "var(--accent)" : st[0] === "st-in" ? "var(--low)" : st[0] === "st-hi" ? "var(--high)" : "var(--mid)";
    s += `<circle cx="${X(q.t)}" cy="${Y(q.v)}" r="${i === pts.length - 1 ? 6 : 4.5}" fill="${col}" stroke="var(--surface)" stroke-width="2"><title>${frDate(q.a.date)} : ${fmtVal(q.a.mg, u)} ${unitLabel(u)}</title></circle>`;
  });
  if (!pts.length) s += `<text x="${W/2}" y="${H/2}" text-anchor="middle">Aucun résultat sur cette période</text>`;
  el.innerHTML = s + "</svg>";
}
function niceStep(x){ const e = Math.pow(10, Math.floor(Math.log10(x || 1))), f = x / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }

function openAnalyse(id){
  const p = P(), a = id ? p.analyses.find(x => x.id === id) : null;
  let u = a ? a.u : p.unit;
  sheet(a ? "Modifier le résultat" : "Nouveau résultat", `
    <label class="f">Date de la prise de sang<input type="date" id="aDate" max="${todayISO()}" value="${a ? a.date : todayISO()}"></label>
    <div class="f"><span>Unité du résultat</span><div class="seg" role="group" aria-label="Unité">${["mg","umol"].map(k => `<button type="button" data-u="${k}" aria-pressed="${u===k}">${unitLabel(k)}</button>`).join("")}</div></div>
    <label class="f">Résultat<input type="text" id="aVal" inputmode="decimal" placeholder="${u === "mg" ? "Ex. : 4,5" : "Ex. : 270"}" value="${a ? (a.u === "mg" ? fmt(a.mg, 2) : Math.round(a.mg * UMOL)) : ""}"></label>
    <label class="f">Commentaire (facultatif)<input type="text" id="aNote" maxlength="80" placeholder="Ex. : contrôle au CHU" value="${esc(a ? a.note : "")}"></label>
    <div id="aMsg"></div>
    <button class="btn primary block" id="aSave">Enregistrer</button>
    ${a ? `<button class="btn danger block" id="aDel">Supprimer ce résultat</button>` : ""}`, b => {
      let confirmed = false;
      b.querySelectorAll("[data-u]").forEach(x => x.addEventListener("click", () => { u = x.dataset.u; confirmed = false; b.querySelectorAll("[data-u]").forEach(y => y.setAttribute("aria-pressed", y.dataset.u === u)); b.querySelector("#aVal").placeholder = u === "mg" ? "Ex. : 4,5" : "Ex. : 270"; b.querySelector("#aMsg").innerHTML = ""; }));
      b.querySelector("#aVal").addEventListener("input", () => { confirmed = false; });
      b.querySelector("#aSave").addEventListener("click", () => {
        const date = b.querySelector("#aDate").value, v = parseNum(b.querySelector("#aVal").value), msg = b.querySelector("#aMsg");
        if (!date || date > todayISO()){ msg.innerHTML = `<div class="err" role="alert">Choisissez une date valide (pas dans le futur).</div>`; return; }
        if (isNaN(v) || v <= 0){ msg.innerHTML = `<div class="err" role="alert">Saisissez le résultat indiqué sur le compte rendu.</div>`; return; }
        const odd = (u === "mg" && v > 50) || (u === "umol" && v < 50);
        if (odd && !confirmed){
          confirmed = true;
          msg.innerHTML = `<div class="warn" role="alert">${esc(fmt(v))} ${unitLabel(u)} semble inhabituel. Le résultat est peut-être en ${unitLabel(u === "mg" ? "umol" : "mg")} : changez l'unité ci-dessus, ou appuyez de nouveau sur Enregistrer pour confirmer.</div>`;
          return;
        }
        const rec = {id: a ? a.id : uid(), date, mg: u === "mg" ? v : v / UMOL, u, note: b.querySelector("#aNote").value.trim()};
        if (a) Object.assign(a, rec); else p.analyses.push(rec);
        save(); closeSheet(); render(); toast("Résultat enregistré");
      });
      const del = b.querySelector("#aDel");
      if (del) del.addEventListener("click", () => armed(del, "Confirmer la suppression", () => { p.analyses = p.analyses.filter(x => x.id !== a.id); save(); closeSheet(); render(); toast("Résultat supprimé"); }));
    });
}
function openSeuils(){
  const p = P(); let u = p.unit;
  const val = mg => mg == null ? "" : (u === "mg" ? fmt(mg, 2) : Math.round(mg * UMOL));
  sheet("Zone cible", `
    <p class="small muted" style="margin:0">Renseignez les seuils indiqués par votre médecin. Ils servent uniquement à colorer le graphique.</p>
    <div class="f"><span>Unité</span><div class="seg" role="group">${["mg","umol"].map(k => `<button type="button" data-u="${k}" aria-pressed="${u===k}">${unitLabel(k)}</button>`).join("")}</div></div>
    <div class="row" style="flex-wrap:nowrap"><label class="f grow">Minimum<input type="text" id="sMin" inputmode="decimal" value="${val(p.seuilMin)}"></label><label class="f grow">Maximum<input type="text" id="sMax" inputmode="decimal" value="${val(p.seuilMax)}"></label></div>
    <div id="sErr" class="err" role="alert"></div>
    <button class="btn primary block" id="sSave">Enregistrer</button>`, b => {
      b.querySelectorAll("[data-u]").forEach(x => x.addEventListener("click", () => {
        const mn = parseNum(b.querySelector("#sMin").value), mx = parseNum(b.querySelector("#sMax").value);
        const toMg = v => isNaN(v) ? null : (u === "mg" ? v : v / UMOL);
        const a = toMg(mn), c = toMg(mx);
        u = x.dataset.u; b.querySelectorAll("[data-u]").forEach(y => y.setAttribute("aria-pressed", y.dataset.u === u));
        b.querySelector("#sMin").value = val(a); b.querySelector("#sMax").value = val(c);
      }));
      b.querySelector("#sSave").addEventListener("click", () => {
        const mn = parseNum(b.querySelector("#sMin").value), mx = parseNum(b.querySelector("#sMax").value);
        if (isNaN(mn) || isNaN(mx) || mn < 0 || mx <= mn){ b.querySelector("#sErr").textContent = "Le maximum doit être supérieur au minimum."; return; }
        p.seuilMin = u === "mg" ? mn : mn / UMOL; p.seuilMax = u === "mg" ? mx : mx / UMOL; p.unit = u;
        save(); closeSheet(); render(); toast("Zone cible enregistrée");
      });
    });
}
function csvFor(p, from, to){
  const an = [...p.analyses].sort((a, b) => a.date.localeCompare(b.date)).filter(a => (!from || a.date >= from) && (!to || a.date <= to));
  const who = [p.prenom, p.nom].filter(Boolean).join(" ") + (p.naissance ? ` (né(e) le ${frDate(p.naissance)})` : "");
  const q = s => /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  let c = `${q(who)};Date de l'analyse;Phé (mg/dL);Phé (µmol/L);Commentaire\n`;
  an.forEach(a => { c += `;${frDate(a.date)};${fmt(a.mg, 1).replace(/\s/g, "")};${Math.round(a.mg * UMOL)};${q(a.note || "")}\n`; });
  if (from || to) c += `\nPériode : ${from ? frDate(from) : "début"} au ${to ? frDate(to) : "aujourd'hui"}\n`;
  c += "Données saisies par l'utilisateur, à titre indicatif.\n";
  return {csv:c, n:an.length};
}

function copyText(ta){
  const done = () => toast("Copié dans le presse-papiers");
  navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); toast("Sélectionné : utilisez Copier"); }) : (ta.select(), toast("Sélectionné : utilisez Copier"));
}
async function shareFile(text, name, type){
  const file = new File([text], name, {type});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:name}); return; } catch(e){ if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

const ING_MODES = [["base","Fruit ou légume de la base"],["prot","Produit emballé (protéines)"],["phe","Phé indiquée sur l'étiquette"],["zero","Sans Phé (sucre, huile, eau…)"]];
const FOOD_BY_NAME = new Map([...FOOD.values()].map(f => [f.n.toLowerCase(), f]));
const blankIng = () => ({nom:"", g:"", mode:"base", ref:"", prot:"", lait:true, phe100:""});
let draft;
try { draft = JSON.parse(localStorage.getItem("phecompte.draft") || "null"); } catch(e){ draft = null; }

const saveDraft = () => { try { localStorage.setItem("phecompte.draft", JSON.stringify(draft)); } catch(e){} };
/* même calcul que scripts/recettes.py */
function ingPhe(x){
  const g = parseNum(x.g); if (isNaN(g) || g <= 0) return NaN;
  if (x.mode === "zero") return 0;
  if (x.mode === "base"){ const f = FOOD.get(x.ref); return f ? g / f.w * PART_MG : NaN; }
  if (x.mode === "prot"){ const pr = parseNum(x.prot); if (isNaN(pr) || pr < 0 || pr > (x.lait ? 12 : 5)) return NaN; return g * pr * (x.lait ? 50 : pr < 0.8 ? 32 : 38) / 100; }
  if (x.mode === "phe"){ const v = parseNum(x.phe100); if (isNaN(v) || v < 0 || v > 5000) return NaN; return g * v / 100; }
  return NaN;
}
function ingRow(x, i){
  const f = x.mode === "base" ? `<input type="text" list="foodNames" data-i="${i}" data-f="nom" placeholder="Ex. : Carotte" value="${esc(x.nom)}" aria-label="Aliment">`

    : x.mode === "phe" ? `<input type="text" inputmode="decimal" data-i="${i}" data-f="phe100" placeholder="Phé en mg pour 100 g" value="${esc(x.phe100)}" aria-label="Phé pour 100 g">` : "";
  return `<div class="card" style="padding:12px;gap:8px;box-shadow:none">

function onPropInput(e){
  const el = e.target, f = el.dataset.f; if (!f) return;
  if (el.dataset.i != null){
    const x = draft.ing[+el.dataset.i];
    if (f === "mode"){ if (e.type !== "change") return; x.mode = el.value; x.ref = ""; redrawIngs(); }
    else if (f === "lait") x.lait = el.value === "1";
    else { x[f] = el.value; if (f === "nom" && x.mode === "base"){ const m = FOOD_BY_NAME.get(el.value.trim().toLowerCase()); x.ref = m ? m.ref : ""; } }
  } else draft[f] = el.value;
  document.getElementById("propSend").innerHTML = "";
  saveDraft(); propCompute();
}
function redrawIngs(){ document.getElementById("ingRows").innerHTML = draft.ing.map(ingRow).join(""); propCompute(); }
function propCompute(){
  let tot = 0, ok = true;
  draft.ing.forEach((x, i) => {
    const out = document.getElementById("ingOut" + i); if (!out) return;
    const v = ingPhe(x);
    if (isNaN(v)){ ok = false; out.textContent = x.mode === "base" && x.nom && !x.ref ? "Aliment introuvable dans la base" : "À compléter"; out.style.color = "var(--mid)"; }
    else { tot += v; out.textContent = `${fmt(v / PART_MG)} part${v / PART_MG > 1 ? "s" : ""} · ${fmt(v, 0)} mg`; out.style.color = ""; }
  });
  const el = document.getElementById("propTotal");
  if (el) el.innerHTML = `${fmt(Math.round(tot / PART_MG * 10) / 10, 1)} parts <span style="font-size:1rem;font-weight:600">· ${fmt(tot, 0)} mg de Phé${ok ? "" : " (incomplet)"}</span>`;
  return {tot, ok};
}
function propReady(){
  const d = draft, err = document.getElementById("propErr"), out = document.getElementById("propSend");
  const ing = d.ing.filter(x => x.nom.trim() || x.g);
  const steps = d.et.split("\n").map(s => s.trim()).filter(Boolean);
  const min = parseInt(d.min, 10);
  const problems = [];
  if (d.n.trim().length < 3) problems.push("donnez un nom à la recette (3 lettres minimum)");
  if (!ing.length) problems.push("ajoutez au moins un ingrédient");
  if (ing.some(x => !x.nom.trim() || isNaN(ingPhe(x)))) problems.push("complétez chaque ingrédient (nom, quantité et valeur demandée)");
  if (!steps.length) problems.push("décrivez au moins une étape");
  if (isNaN(min) || min < 0 || min > 1440) problems.push("indiquez le temps de préparation en minutes");
  if (problems.length){ err.textContent = "Pour continuer, " + problems.join(", ") + "."; out.innerHTML = ""; return; }
  err.textContent = "";
  const clean = s => String(s).replace(/`/g, "'").trim();
  const payload = {v:1, n:clean(d.n), t:d.t, lv:d.lv, min, p:clean(d.p).slice(0, 3), kcal: parseInt(d.kcal, 10) > 0 ? parseInt(d.kcal, 10) : null, auteur:clean(d.auteur),
    ing: ing.map(x => { const o = {nom:clean(x.nom), g:parseNum(x.g), mode:x.mode}; if (x.mode === "base") o.ref = x.ref; if (x.mode === "prot"){ o.prot = parseNum(x.prot); o.lait = x.lait; } if (x.mode === "phe") o.phe100 = parseNum(x.phe100); return o; }),
    et: steps.map(clean)};
  const tot = ing.reduce((s, x) => s + ingPhe(x), 0);
  const body = `<!-- phecompte-recette v1 -->
### ${payload.n}

**${payload.t}** · ${payload.lv} · ${min} min${payload.p ? " · " + payload.p + " pers." : ""}${payload.kcal ? " · " + payload.kcal + " kcal" : ""}
**Total calculé : ${fmt(Math.round(tot / PART_MG * 10) / 10, 1)} parts (${fmt(tot, 0)} mg de Phé)**

#### Ingrédients
${ing.map(x => `- ${fmt(parseNum(x.g))} g ${clean(x.nom)} — ${ING_MODES.find(m => m[0] === x.mode)[1].toLowerCase()} → ${fmt(ingPhe(x) / PART_MG)} part(s)`).join("\n")}

#### Préparation
${steps.map((s, i) => `${i + 1}. ${clean(s)}`).join("\n")}

<details><summary>Données pour l'application (ne pas modifier)</summary>

\`\`\`json
${JSON.stringify(payload, null, 1)}
\`\`\`
</details>`;
  const title = "[Recette] " + payload.n;
  const full = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  const tooLong = full.length > 7500;
  out.innerHTML = `<div class="card" style="gap:10px">
    <b>Dernière étape</b>
    <span class="small">${tooLong ? "La recette est longue : copiez le texte ci-dessous, puis ouvrez GitHub et collez-le dans la description avant de cliquer sur « Create » / « Submit new issue »." : "GitHub va s'ouvrir avec la recette déjà remplie. Connectez-vous si besoin puis cliquez sur « Create » (ou « Submit new issue »). Elle apparaîtra dans l'application quelques minutes plus tard."}</span>
    <a class="btn primary block" href="${esc(tooLong ? `https://github.com/${REPO}/issues/new?title=${encodeURIComponent(title)}` : full)}" target="_blank" rel="noopener" data-act="propSent">Ouvrir GitHub</a>
    <button class="btn block" data-act="propCopy">Copier le texte de la recette</button>
    <textarea id="propText" readonly aria-label="Texte de la recette">${esc(body)}</textarea></div>`;
}

function viewConvertir(){

    <div class="conv"><label class="f">mg/dL<input type="text" id="cMg" inputmode="decimal" value="4"></label><span class="eq">=</span><label class="f">µmol/L<input type="text" id="cUm" inputmode="decimal" value="${fmt(4 * UMOL)}"></label></div>
    <div class="small muted">1 mg/dL (ou mg/100 mL) = ${fmt(UMOL)} µmol/L, d'après la masse molaire de la phénylalanine (165,19 g/mol).</div>
  </section>
  <section class="card"><div class="label">Repères</div><div style="overflow-x:auto"><table class="ref"><thead><tr><th>mg/dL</th><th>µmol/L</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="card"><div class="label">Les parts</div><p style="margin:0">1 part de Phé = ${PART_MG} mg de phénylalanine. Le nombre de parts autorisé par jour est fixé par l'équipe médicale.</p></section>`;
}
function bindConv(){
  const a = document.getElementById("cMg"), b = document.getElementById("cUm");
  a.addEventListener("input", () => { const v = parseNum(a.value); b.value = isNaN(v) ? "" : fmt(Math.round(v * UMOL * 100) / 100); });
  b.addEventListener("input", () => { const v = parseNum(b.value); a.value = isNaN(v) ? "" : fmt(Math.round(v / UMOL * 100) / 100); });
}

    <div class="list">
      <button class="item" data-act="seuils"><span class="grow"><span class="t">Zone cible</span><br><span class="s num">${p.seuilMin != null ? `${fmtVal(p.seuilMin, p.unit)} à ${fmtVal(p.seuilMax, p.unit)} ${unitLabel(p.unit)}` : "Non définie"}</span></span>›</button>
      <button class="item" data-act="editProfile"><span class="grow"><span class="t">Objectif de parts par jour</span><br><span class="s">${p.objectif ? fmt(p.objectif) + " parts" : "Non défini"}</span></span>›</button>
    </div>
  </section>
  <section class="card"><div class="label">Profils sur cet appareil</div><div class="list">
    ${others.map(o => `<button class="item" data-act="switch" data-id="${o.id}">${avatarHTML(o)}<span class="grow t">${esc(o.prenom)} ${esc(o.nom)}${o.isExample ? " (exemple)" : ""}</span><span class="s">Utiliser</span></button>`).join("") || `<div class="small muted">Un seul profil. Ajoutez-en un pour chaque personne suivie.</div>`}
  </div><button class="btn block" data-act="newProfile">${icon("plus")}Ajouter un profil</button></section>
  <section class="card"><div class="label">Sauvegarde</div>
    <p class="small muted" style="margin:0">Les données restent sur ce téléphone uniquement. Exportez régulièrement une sauvegarde pour pouvoir les restaurer sur un autre appareil.</p>
    <div class="row"><button class="btn grow" data-act="backup">Exporter</button><label class="btn grow" for="restoreFile">Restaurer</label><input type="file" id="restoreFile" accept=".json,application/json" hidden></div>
  </section>
  <section class="card"><div class="label">À propos</div>
    <p class="small" style="margin:0"><b>Outil indicatif.</b> Les calculs et graphiques ne remplacent ni l'avis de l'équipe médicale ni le régime prescrit. En cas de doute sur un aliment ou un résultat, demandez à votre diététicien(ne) ou à votre médecin.</p>
    <p class="small muted" style="margin:0">La table des aliments, la méthode de calcul des produits emballés et les recettes proviennent de l'application aPhetit (2015-2017), conçue avec la SFEIM et l'association Les Feux Follets. Ces données n'ont pas été mises à jour depuis. Usage personnel uniquement.</p>
    <a class="btn block" href="aliments.html" target="_blank" rel="noopener">Consulter la base d'aliments et recettes</a>
    <p class="small muted" style="margin:0">Liens utiles : <a href="https://www.sfeim.org" target="_blank" rel="noopener">sfeim.org</a> · <a href="https://www.phenylcetonurie.org" target="_blank" rel="noopener">phenylcetonurie.org</a></p>
  </section>
  ${db.profiles.length > 1 ? `<button class="btn danger block" data-act="delProfile">Supprimer le profil de ${esc(p.prenom)}</button>` : ""}`;
}
function openProfile(isNew){
  const p = isNew ? newProfile("") : P();
  let photo = p.photo;
  sheet(isNew ? "Nouveau profil" : "Modifier le profil", `
    <div class="row"><span id="pAv">${avatarHTML(p, true)}</span><label class="btn" for="pPhoto">Choisir une photo</label><input type="file" id="pPhoto" accept="image/*" hidden>${photo ? `<button class="btn ghost" id="pNoPhoto">Retirer</button>` : ""}</div>
    <div class="row" style="flex-wrap:nowrap"><label class="f grow">Prénom<input type="text" id="pPre" maxlength="30" value="${esc(p.isExample ? "" : p.prenom)}"></label><label class="f grow">Nom<input type="text" id="pNom" maxlength="30" value="${esc(p.nom)}"></label></div>
    <div class="row" style="flex-wrap:nowrap"><label class="f grow">Sexe<select id="pSexe"><option value="">—</option>${["Féminin","Masculin"].map(s => `<option ${p.sexe===s?"selected":""}>${s}</option>`).join("")}</select></label><label class="f grow">Date de naissance<input type="date" id="pNai" max="${todayISO()}" value="${esc(p.naissance)}"></label></div>
    <label class="f">Objectif de parts de Phé par jour (facultatif)<input type="text" id="pObj" inputmode="decimal" placeholder="Fixé par l'équipe médicale" value="${p.objectif ? fmt(p.objectif) : ""}"></label>
    <div id="pErr" class="err" role="alert"></div>
    <button class="btn primary block" id="pSave">${isNew ? "Créer le profil" : "Enregistrer"}</button>`, b => {
      b.querySelector("#pPhoto").addEventListener("change", e => {
        const f = e.target.files[0]; if (!f) return;
        const img = new Image(), url = URL.createObjectURL(f);
        img.onload = () => {
          const S = 192, c = document.createElement("canvas"); c.width = c.height = S;
          const k = Math.max(S / img.width, S / img.height), w = img.width * k, h = img.height * k;
          c.getContext("2d").drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
          photo = c.toDataURL("image/jpeg", 0.82); URL.revokeObjectURL(url);
          b.querySelector("#pAv").innerHTML = `<span class="avatar lg"><img src="${photo}" alt=""></span>`;
        };
        img.onerror = () => toast("Image illisible");
        img.src = url;
      });
      const np = b.querySelector("#pNoPhoto"); if (np) np.addEventListener("click", () => { photo = ""; b.querySelector("#pAv").innerHTML = avatarHTML({...p, photo:""}, true); np.remove(); });
      b.querySelector("#pSave").addEventListener("click", () => {
        const pre = b.querySelector("#pPre").value.trim();
        if (!pre){ b.querySelector("#pErr").textContent = "Indiquez au moins un prénom."; return; }
        const obj = parseNum(b.querySelector("#pObj").value);
        Object.assign(p, {prenom:pre, nom:b.querySelector("#pNom").value.trim(), sexe:b.querySelector("#pSexe").value, naissance:b.querySelector("#pNai").value, photo, objectif: isNaN(obj) || obj <= 0 ? null : obj});
        if (isNew){ db.profiles.push(p); db.current = p.id; }
        if (p.isExample){ // turning the example into a real profile: start clean
          delete p.isExample; p.repas = {pdj:[],dej:[],gouter:[],diner:[]}; p.analyses = []; p.custom = []; p.favoris = []; p.seuilMin = p.seuilMax = null;
        }
        save(); closeSheet(); render(); toast(isNew ? "Profil créé" : "Profil enregistré");
      });
    });
}
function openBackup(){
  const data = JSON.stringify({app:"PhéCompte", version:1, exportedAt:new Date().toISOString(), ...db});
  sheet("Exporter une sauvegarde", `
    <p class="small muted" style="margin:0">Ce fichier contient tous les profils, repas et résultats. Gardez-le en lieu sûr : il contient des données de santé.</p>
    ${framed ? "" : `<button class="btn primary block" id="bShare">Partager ou enregistrer le fichier</button>`}
    <button class="btn block" id="bCopy">Copier le contenu</button>
    <textarea id="bText" readonly aria-label="Sauvegarde">${esc(data)}</textarea>`, b => {
      b.querySelector("#bCopy").addEventListener("click", () => copyText(b.querySelector("#bText")));
      const s = b.querySelector("#bShare"); if (s) s.addEventListener("click", () => shareFile(data, `phecompte-sauvegarde-${todayISO()}.json`, "application/json"));
    });
}
function restore(text){
  try {
    const d = JSON.parse(text);
    if (!Array.isArray(d.profiles) || !d.profiles.length || !d.profiles.every(p => p.id && p.repas && Array.isArray(p.analyses))) throw 0;
    db = {profiles:d.profiles, current:d.profiles.some(p => p.id === d.current) ? d.current : d.profiles[0].id};
    save(); render(); toast(`${db.profiles.length} profil${db.profiles.length > 1 ? "s" : ""} restauré${db.profiles.length > 1 ? "s" : ""}`);
  } catch(e){ toast("Ce fichier n'est pas une sauvegarde PhéCompte valide"); }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-tab]"); if (!t) return;
  if (t.dataset.tab){ if (location.hash.slice(1) === t.dataset.tab) { ui.recipe = null; render(); } else location.hash = t.dataset.tab; window.scrollTo(0, 0); return; }
  const p = P(), a = t.dataset.act;
  switch (a){
    case "closeScrim": if (e.target === t) closeSheet(); break;
    case "closeSheet": closeSheet(); break;
    case "meal": ui.meal = t.dataset.m; render(); break;
    case "addFood": ui.search = ""; openAddFood(); break;
    case "addCat": ui.addCat = t.dataset.c; ui.search = ""; openAddFood.draw(); break;
    case "pickFood": openWeight(t.dataset.ref); break;
    case "editItem": openWeight(p.repas[ui.meal][+t.dataset.i].ref, +t.dataset.i); break;
    case "saveCustom": {
      const nom = document.getElementById("eNom").value.trim(), r = customCalc(), err = document.getElementById("eErr");
      if (nom.length < 3){ err.textContent = "Le nom doit contenir au moins 3 lettres."; break; }
      if (!r.ok){ err.textContent = r.msg; break; }
      const ref = "c" + uid();
      p.custom.push({ref, n:nom, w:r.w, c:"C", lait:r.lait, prot:r.prot}); save(); openWeight(ref); break;
    }
    case "delCustom": armed(t, "Supprimer ?", () => {
      const used = MEALS.some(([m]) => p.repas[m].some(it => it.ref === t.dataset.ref));
      if (used){ toast("Retirez d'abord ce produit des repas du jour"); return; }
      p.custom = p.custom.filter(c => c.ref !== t.dataset.ref); save(); openAddFood.draw(); }); break;
    case "resetDay": armed(t, "Confirmer : vider les 4 repas", () => { MEALS.forEach(([m]) => p.repas[m] = []); ui.meal = "pdj"; save(); render(); toast("Nouvelle journée"); }); break;
    case "unit": p.unit = t.dataset.u; save(); render(); break;
    case "range": ui.range = t.dataset.r; render(); break;
    case "seuils": openSeuils(); break;
    case "addAnalyse": openAnalyse(); break;
    case "editAnalyse": openAnalyse(t.dataset.id); break;
    case "export": openExport(); break;
    case "recType": ui.recType = t.dataset.t; render(); break;
    case "recIng": { const k = t.dataset.k; ui.recIng = ui.recIng.includes(k) ? ui.recIng.filter(x => x !== k) : [...ui.recIng, k].slice(0, 2); render(); break; }
    case "recipe": ui.recipe = rid(t.dataset.id); render(); window.scrollTo(0, 0); break;
    case "recBack": ui.recipe = null; render(); break;
    case "propose": openPropose(); break;
    case "ingAdd": draft.ing.push(blankIng()); saveDraft(); redrawIngs(); document.getElementById("propSend").innerHTML = ""; break;
    case "ingDel": draft.ing.splice(+t.dataset.i, 1); if (!draft.ing.length) draft.ing.push(blankIng()); saveDraft(); redrawIngs(); document.getElementById("propSend").innerHTML = ""; break;
    case "propReady": propReady(); break;
    case "propCopy": copyText(document.getElementById("propText")); break;
    case "propSent": toast("Merci ! Terminez l'envoi sur GitHub"); break;
    case "propClear": armed(t, "Confirmer : tout effacer", () => { draft = {n:"", t:"Plat principal", lv:"Moyen", p:"", min:"", kcal:"", auteur:"", ing:[blankIng()], et:""}; saveDraft(); openPropose(); }); break;
    case "fav": { const id = rid(t.dataset.id); p.favoris = p.favoris.includes(id) ? p.favoris.filter(x => x !== id) : [...p.favoris, id]; save(); render(); break; }
    case "editProfile": openProfile(false); break;
    case "newProfile": openProfile(true); break;
    case "startReal": openProfile(false); break;
    case "switch": db.current = t.dataset.id; save(); render(); toast("Profil de " + P().prenom); break;
    case "delProfile": armed(t, "Confirmer : tout supprimer pour " + p.prenom, () => { db.profiles = db.profiles.filter(x => x.id !== p.id); db.current = db.profiles[0].id; save(); render(); toast("Profil supprimé"); }); break;
    case "backup": openBackup(); break;
  }
});
document.getElementById("hdrAvatar").addEventListener("click", () => { location.hash = "profil"; });
document.addEventListener("input", e => {
  if (e.target.id === "recQ"){ ui.recQ = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById("recQ"); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  if (e.target.id === "restoreFile" && e.target.files[0]){ const r = new FileReader(); r.onload = () => restore(r.result); r.readAsText(e.target.files[0]); }
});
route();
loadCommunity();
</script>
