<title>PhéCompte</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone shell (max 560px), sticky header, fixed bottom tab bar, bottom sheets for input. */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface-2:#e9eff2; --ink:#12232e; --muted:#566b78; --line:#d6e0e5;
  --accent:#0d7a70; --accent-ink:#ffffff; --accent-soft:#d5efeb; --sun:#f2b33d; --sun-ink:#3d2a00;
  --low:#2b9a57; --mid:#d98a1f; --high:#cf3f39; --band:#cdeee4;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(18,35,46,.06),0 6px 20px rgba(18,35,46,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c161c; --surface:#14222b; --surface-2:#1b2c36; --ink:#e6eef2; --muted:#93a8b4; --line:#253a46;
  --accent:#3cbcae; --accent-ink:#06201d; --accent-soft:#163a37; --sun:#f5c35e; --sun-ink:#2b1d00;
  --low:#4cc47e; --mid:#f0a845; --high:#f06a62; --band:#173d36; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c161c; --surface:#14222b; --surface-2:#1b2c36; --ink:#e6eef2; --muted:#93a8b4; --line:#253a46;
  --accent:#3cbcae; --accent-ink:#06201d; --accent-soft:#163a37; --sun:#f5c35e; --sun-ink:#2b1d00;
  --low:#4cc47e; --mid:#f0a845; --high:#f06a62; --band:#173d36; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
.shell{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
header.top h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
header.top h1 small{display:block;font:500 .78rem var(--f-body);color:var(--muted);letter-spacing:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 .95rem var(--f-display);overflow:hidden;flex:none;border:0;cursor:pointer;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:64px;height:64px;font-size:1.3rem}
main{display:grid;gap:16px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;display:grid;gap:12px;min-width:0}
.label{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.btn{text-decoration:none;color:inherit}a.btn.primary{color:var(--accent-ink)}
.btn.danger{color:var(--high);border-color:color-mix(in srgb,var(--high) 40%,var(--line))}
.btn.danger.armed{background:var(--high);color:#fff;border-color:var(--high)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.tab:focus-visible,.item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.icon-btn{appearance:none;border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted);line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button b{display:block;font:700 1.05rem var(--f-display);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:600;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:grid;gap:6px;font-weight:600;font-size:.9rem}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:46px}
textarea{min-height:120px;font:13px/1.4 ui-monospace,Menlo,monospace}
.err{color:var(--high);font-size:.86rem;font-weight:600}
.warn{background:color-mix(in srgb,var(--mid) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--mid) 45%,var(--line));border-radius:12px;padding:10px 12px;font-size:.9rem}
.note{background:var(--accent-soft);border-radius:12px;padding:12px;font-size:.92rem}
/* day total */
.total{background:var(--ink);color:var(--bg);border:0;padding:18px}
.total .label{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.total .big{font:800 3.4rem/1 var(--f-display);letter-spacing:-.02em}
.total .big span{font-size:1.1rem;font-weight:600;margin-left:6px;letter-spacing:0}
.bar{height:10px;background:color-mix(in srgb,var(--bg) 18%,var(--ink));border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .3s}
.bar.over i{background:var(--high)}
/* lists */
.list{display:grid}
.item{appearance:none;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);width:100%;cursor:pointer;min-width:0}
.list>.item:first-child,.list>:first-child .item{border-top:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.84rem;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}
.d0{background:var(--low)}.d1{background:var(--mid)}.d2{background:var(--high)}
.cat{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font:700 .8rem var(--f-display)}
.cat.F{background:color-mix(in srgb,var(--mid) 20%,var(--surface));color:var(--mid)}
.cat.L{background:color-mix(in srgb,var(--low) 20%,var(--surface));color:var(--low)}
.cat.R{background:color-mix(in srgb,var(--high) 14%,var(--surface));color:var(--high)}
.cat.H{background:color-mix(in srgb,var(--sun) 28%,var(--surface));color:color-mix(in srgb,var(--sun) 55%,var(--ink))}
.cat.C{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent)}
.parts{font:700 1rem var(--f-display);text-align:right;white-space:nowrap}
.parts small{display:block;font:500 .78rem var(--f-body);color:var(--muted)}
.empty{text-align:center;padding:22px 8px;color:var(--muted)}
.letter{font:800 .8rem var(--f-display);color:var(--accent);padding:12px 2px 2px;letter-spacing:.06em}
.legend{display:flex;gap:14px;font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:99px}
.st-in{background:color-mix(in srgb,var(--low) 18%,var(--surface));color:var(--low)}
.st-hi{background:color-mix(in srgb,var(--high) 16%,var(--surface));color:var(--high)}
.st-lo{background:color-mix(in srgb,var(--mid) 18%,var(--surface));color:var(--mid)}
.chart{width:100%;overflow:hidden}
.chart svg{display:block;width:100%}
.chart text{fill:var(--muted);font:11px var(--f-body)}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tab{appearance:none;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:9px 0 8px;font-size:.68rem;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg.i{stroke-width:2.4}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,14,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet-h h2{font-size:1.2rem;flex:1}
.sheet-b{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.grams{display:flex;align-items:center;gap:8px}
.grams input{text-align:center;font:800 2rem var(--f-display);min-height:64px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px)}
.recipe h2{font-size:1.6rem}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.facts b{display:block;font:800 1.3rem var(--f-display)}
.facts span{font-size:.78rem;color:var(--muted)}
ol.steps{margin:0;padding-left:1.3em;display:grid;gap:10px;max-width:65ch}
ul.ing{margin:0;padding-left:1.1em;display:grid;gap:4px}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.conv input{font:800 1.6rem var(--f-display);text-align:center;min-height:60px}
.conv .eq{font:700 1.4rem var(--f-display);color:var(--muted);padding-bottom:14px}
table.ref{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.ref td,table.ref th{padding:8px 4px;border-top:1px solid var(--line);text-align:right}
table.ref th{font-size:.78rem;color:var(--muted);text-align:right;border-top:0}
table.ref td:first-child,table.ref th:first-child{text-align:left}
.banner{background:var(--sun);color:var(--sun-ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:.92rem}
.banner .btn{min-height:38px;padding:7px 12px;background:var(--sun-ink);color:var(--sun);border:0}
details summary{cursor:pointer;font-weight:700}
.small{font-size:.85rem}
input,select,textarea{min-width:0;max-width:100%}.row>.f{min-width:0}.sheet-b{overflow-x:hidden}
.find{gap:8px}.find a,.card a:not(.btn){color:var(--accent)}.find.old{opacity:.7}
.card.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:none}
.daynav{display:flex;align-items:center;gap:6px;padding:8px;grid-template-columns:none}
.daynav .pick{position:relative;display:grid;text-align:center;line-height:1.25;padding-block:4px}
.daynav .pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;min-height:0}
.daynav .icon-btn:disabled{opacity:.3}
svg.i.xs{width:13px;height:13px;vertical-align:-2px}
.rt{color:var(--accent);font-weight:600;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal>span{font-size:.72rem;color:var(--muted);font-weight:700}
.cal-d{appearance:none;border:1px solid transparent;background:var(--surface-2);border-radius:10px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:2px 0;font:inherit;color:var(--ink)}
.cal-d:disabled{background:transparent;color:var(--muted);opacity:.45;cursor:default}
.cal-d .n{font-weight:700;font-size:.9rem;line-height:1.1}
.cal-d .p{font-size:.66rem;color:var(--muted);line-height:1.2}
.cal-d.today{border-color:var(--accent)}
.cal-d.has-a{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-d.has-a.st-in{box-shadow:inset 0 0 0 2px var(--low)}
.cal-d.has-a.st-hi{box-shadow:inset 0 0 0 2px var(--high)}
.cal-d.has-a.st-lo{box-shadow:inset 0 0 0 2px var(--mid)}
.cal-d:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
.nd{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--sun);display:inline-block}
</style>

<script>
"use strict";
const PART_MG = 20, UMOL = 60.54;
const KEY = "phecompte.v1";
const MEALS = [["pdj","Petit déj."],["dej","Déjeuner"],["gouter","Goûter"],["diner","Dîner"]];
const TENEUR = ["Faible","Moyenne","Forte"];
const ICONS = {
  repas:'<path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v6M7 3h4M17 3c-1.7 0-3 2.2-3 5s1.3 4 3 4v9"/>',
  suivi:'<path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/>',
  recettes:'<path d="M6 13.9a4 4 0 1 1 2.9-6.6 5 5 0 0 1 9.3 2A3.5 3.5 0 0 1 18 16H6z"/><path d="M6 16v4h12v-4"/>',
  convertir:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
  trouvailles:'<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/><path d="M3 9h18"/>',
  profil:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  close:'<path d="M18 6 6 18M6 6l12 12"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
  next:'<path d="m9 18 6-6-6-6"/>',
  repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'
};
const TABS = [["repas","Repas"],["suivi","Suivi"],["recettes","Recettes"],["trouvailles","Trouvailles"],["convertir","Convertir"],["profil","Profil"]];
const icon = (n, cls="i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d=2) => Number(n).toLocaleString("fr-FR", {maximumFractionDigits:d});
const parseNum = s => { const v = parseFloat(String(s).replace(",", ".").trim()); return isNaN(v) ? NaN : v; };
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const isoAdd = days => { const d = new Date(); d.setDate(d.getDate()+days); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const frDate = iso => { const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; };
const longDate = iso => new Date(iso + "T12:00").toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
const uid = () => Math.random().toString(36).slice(2, 9);
const framed = (() => { try { return window.self !== window.top; } catch(e) { return true; } })();

/* x = 1 : aliment retiré du consensus SFEIM 2009, gardé pour relire les anciens repas mais plus proposé */
const FOOD = new Map(ALIMENTS.map(([id, n, w, t, c, x]) => ["a"+id, {ref:"a"+id, n, w, t, c, x:!!x}]));
/* calories des fruits et légumes : Ciqual 2020 (data/kcal-fruits-legumes.json) */
if (typeof KCAL_FL !== "undefined") for (const [ref, k] of Object.entries(KCAL_FL)){ const f = FOOD.get(ref); if (f){ f.kcal = k.kcal; f.ciq = k; } }
/* catalogue des produits hypoprotéinés (data/hypo-catalogue.json) */
const HYPO_FOODS = (typeof HYPO !== "undefined" ? HYPO : []).map(h => ({ref:h.id, n:h.n, marque:h.marque, cat:h.cat, c:"H", kcal:h.kcal, prot:h.prot, phe100:h.phe,
  w: h.phe ? Math.round(100 * 2000 / h.phe) / 100 : null, base:h.base, unit:h.unit, uw:h.uw, src:h.src, rq:h.rq, cata:true}));
HYPO_FOODS.forEach(f => FOOD.set(f.ref, f));

/* ---------- storage ---------- */
let storageOK = true;
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); }
  catch(e){ storageOK = false; }
  return null;
}
function save(){
  const td = todayISO();
  db.profiles.forEach(p => { for (const k of Object.keys(p.days || {})) if (k !== td && dayEmpty(p.days[k])) delete p.days[k]; });
  if (SNAP) stamp();
  try { localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; }
  catch(e){ storageOK = false; }
  if (typeof driveSoon === "function") driveSoon();
}
function emptyRepas(){ return {pdj:[], dej:[], gouter:[], diner:[]}; }
function newProfile(prenom){
  return {id:uid(), prenom, nom:"", sexe:"", naissance:"", photo:"", seuilMin:null, seuilMax:null, unit:"mg", objectif:null,
          days:{}, routine:emptyRepas(), custom:[], analyses:[], favoris:[]};
}
/* données v1 (une seule « journée en cours ») -> v2 (journal par date) */
function migrate(p){
  if (!p.days || typeof p.days !== "object") p.days = {};
  if (p.repas){
    // l'ancienne version ne datait pas la journée en cours : on la range au jour de la mise à jour et on prévient l'utilisateur
    if (MEALS.some(([m]) => (p.repas[m] || []).length) && !p.days[todayISO()]){ p.days[todayISO()] = {repas:p.repas, note:"", tags:[]}; p.migratedDay = todayISO(); }
    delete p.repas;
  }
  if (!p.routine) p.routine = emptyRepas();
  MEALS.forEach(([m]) => { if (!Array.isArray(p.routine[m])) p.routine[m] = []; });
  ["custom","analyses","favoris"].forEach(k => { if (!Array.isArray(p[k])) p[k] = []; });
  for (const d of Object.values(p.days)){

function optNum(id, max){ const s = document.getElementById(id).value.trim(); if (!s) return {v:null}; const v = parseNum(s); return isNaN(v) || v < 0 || v > max ? {err:true} : {v:Math.round(v * 10) / 10}; }
function hypoCalc(){
  const k = optNum("hKcal", 900), ph = {v:null};
  if (k.err) return {ok:false, msg:"Les calories doivent être un nombre entre 0 et 900 kcal pour 100 g."};
  if (ph.err) return {ok:false, msg:"La Phé doit être un nombre entre 0 et 2000 mg pour 100 g."};
  const w = ph.v ? Math.round(100 * 2000 / ph.v) / 100 : null;
  return {ok:true, kcal:k.v, phe100:ph.v, w, msg:[k.v != null ? `100 g = ${fmt(k.v, 0)} kcal` : "Calories non renseignées", "parts de Phé non comptées"].join(" · ")};
}
function openEditCustom(ref){

    <p class="small muted" style="margin:0">${esc(ruleTxt(c))}. Les parts ne se modifient pas ici, pour ne pas fausser l'historique : si la recette du produit change, créez un nouveau produit.</p>

        if (k.err){ b.querySelector("#cErr").textContent = "Les calories doivent être un nombre positif."; return; }
        c.n = n; if (k.v == null) delete c.kcal; else c.kcal = k.v;

function customCalc(){
  const type = document.getElementById("eLait").value;
  if (type === "pp"){
    const pp = parseNum(document.getElementById("ePp").value), unit = (document.getElementById("eUnit").value.trim() || "portion").slice(0, 20);
    if (isNaN(pp)) return {ok:false, msg:"Indiquez le nombre de parts d'une portion, tel que donné par l'équipe médicale."};
    if (pp < 0 || pp > 50) return {ok:false, msg:"Le nombre de parts doit être compris entre 0 et 50."};
    const v = Math.round(pp * 100) / 100;
    return {ok:true, pp:v, unit, msg:`1 ${unit} = ${fmt(v)} part${v > 1 ? "s" : ""} de Phé`};
  }
  const lait = type === "1";
  const prot = parseNum(document.getElementById("eProt").value);
  const max = lait ? 12 : 5;
  if (isNaN(prot)) return {ok:false, msg:"Saisissez la quantité de protéines.", lait};
  if (prot < 0 || prot > max) return {ok:false, msg:`Pour ce type de produit, la valeur doit être entre 0 et ${max} g. Vérifiez l'étiquette ou le type choisi.`, lait, prot};
  let w = null;
  if (prot > 0) w = lait ? 200 / (5 * prot) : (prot < 0.8 ? 200 / (3.2 * prot) : 200 / (3.8 * prot));
  w = w && Math.round(100 * w) / 100;
  return {ok:true, w, lait, prot, msg: w ? `1 part de Phé = ${fmt(w)} g de ce produit` : "Sans protéines : ce produit ne compte pas de part."};
}

    <div class="chart" id="chart"></div>
    <div class="legend">${hasSeuil ? `<span><i class="dot" style="background:var(--band);border:1px solid var(--low)"></i>Zone cible ${fmtVal(p.seuilMin,u)}–${fmtVal(p.seuilMax,u)} ${unitLabel(u)}</span><button class="btn ghost small" data-act="seuils" style="min-height:0;padding:0">Modifier</button>` : ""}<span><svg width="10" height="9" aria-hidden="true"><path d="M0 9 L10 9 L5 1 Z" fill="var(--sun)"/></svg>Note du jour</span></div>

    ${an.length ? [...an].reverse().map(a => { const s = status(p, a.mg); return `<button class="item" data-act="editAnalyse" data-id="${a.id}">
      <span class="dot ${s ? (s[0]==="st-in" ? "d0" : s[0]==="st-hi" ? "d2" : "d1") : ""}"></span>
      <span class="grow"><span class="t num">${frDate(a.date)}</span>${a.note ? `<br><span class="s">${esc(a.note)}</span>` : ""}${notesBefore(p, a.date).map(([i, n]) => `<br><span class="s" style="color:var(--mid)">Note du ${frDate(i).slice(0, 5)} : ${esc(n)}</span>`).join("")}</span>
      <span class="parts num">${fmtVal(a.mg, u)}<small>${unitLabel(u)}</small></span></button>`; }).join("") : `<div class="empty">Ajoutez le résultat de votre dernière prise de sang pour commencer le suivi.</div>`}
  </div></section>`;

function drawChart(){
  const el = document.getElementById("chart"); if (!el) return;
  const p = P(), u = p.unit;
  const W = Math.max(260, el.clientWidth || 320), H = 210, m = {l:40, r:12, t:12, b:28};
  const an = [...p.analyses].sort((a, b) => a.date.localeCompare(b.date));
  const now = Date.now(), day = 864e5;
  const spans = {"3m":91, "6m":182, "1a":365};
  let x0, x1 = now + 7 * day;
  if (ui.range === "all"){ x0 = an.length ? Math.min(new Date(an[0].date+"T12:00").getTime() - 10*day, now - 30*day) : now - 182*day; }
  else x0 = now - spans[ui.range] * day;
  const pts = an.map(a => ({t:new Date(a.date + "T12:00").getTime(), v:toUnit(a.mg, u), a})).filter(q => q.t >= x0 && q.t <= x1);
  let vmax = Math.max(...pts.map(q => q.v), p.seuilMax != null ? toUnit(p.seuilMax, u) : 0, u === "mg" ? 8 : 480);
  const step = niceStep(vmax / 4); vmax = Math.ceil(vmax * 1.08 / step) * step;
  const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => H - m.b - v / vmax * (H - m.t - m.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Évolution du taux de Phé en ${unitLabel(u)}">`;
  if (p.seuilMin != null && p.seuilMax != null){
    const a = Y(toUnit(p.seuilMax, u)), b = Y(toUnit(p.seuilMin, u));
    s += `<rect x="${m.l}" y="${a}" width="${W - m.l - m.r}" height="${b - a}" fill="var(--band)"/>`;
  }
  for (let v = 0; v <= vmax + 1e-9; v += step){
    const y = Y(v);
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 6}" y="${y + 4}" text-anchor="end">${fmt(v, u === "mg" ? 1 : 0)}</text>`;
  }
  const d0 = new Date(x0); d0.setDate(1); d0.setHours(12);
  const months = (x1 - x0) / day / 30, every = months > 13 ? 3 : months > 7 ? 2 : 1;
  for (let d = new Date(d0), i = 0; d.getTime() <= x1; d.setMonth(d.getMonth() + 1), i++){
    if (d.getTime() < x0 || d.getMonth() % every) continue;
    const x = X(d.getTime());
    s += `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${H - m.b}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${x}" y="${H - 8}" text-anchor="middle">${d.toLocaleDateString("fr-FR", {month:"short"}).replace(".", "")}${d.getMonth() === 0 ? " " + String(d.getFullYear()).slice(2) : ""}</text>`;
  }
  if (pts.length > 1) s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(q => X(q.t) + "," + Y(q.v)).join(" ")}"/>`;
  pts.forEach((q, i) => {
    const st = status(p, q.a.mg), col = !st ? "var(--accent)" : st[0] === "st-in" ? "var(--low)" : st[0] === "st-hi" ? "var(--high)" : "var(--mid)";
    s += `<circle cx="${X(q.t)}" cy="${Y(q.v)}" r="${i === pts.length - 1 ? 6 : 4.5}" fill="${col}" stroke="var(--surface)" stroke-width="2"><title>${frDate(q.a.date)} : ${fmtVal(q.a.mg, u)} ${unitLabel(u)}</title></circle>`;
  });
  Object.entries(p.days).forEach(([iso, d]) => { const tt = new Date(iso + "T12:00").getTime(), txt = dayNoteTxt(d); if (!txt || tt < x0 || tt > x1) return; const x = X(tt), y = H - m.b; s += `<path d="M${x - 4} ${y} L${x + 4} ${y} L${x} ${y - 7} Z" fill="var(--sun)"><title>${frDate(iso)} : ${esc(txt)}</title></path>`; });
  if (!pts.length) s += `<text x="${W/2}" y="${H/2}" text-anchor="middle">Aucun résultat sur cette période</text>`;
  el.innerHTML = s + "</svg>";
}
function niceStep(x){ const e = Math.pow(10, Math.floor(Math.log10(x || 1))), f = x / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }

function viewCalendar(p){

  </section>`;
}

function openAnalyse(id){

function csvFor(p, from, to){
  const an = [...p.analyses].sort((a, b) => a.date.localeCompare(b.date)).filter(a => (!from || a.date >= from) && (!to || a.date <= to));
  const who = [p.prenom, p.nom].filter(Boolean).join(" ") + (p.naissance ? ` (né(e) le ${frDate(p.naissance)})` : "");
  const q = s => /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  let c = `${q(who)};Date de l'analyse;Phé (mg/dL);Phé (µmol/L);Commentaire\n`;
  an.forEach(a => { c += `;${frDate(a.date)};${fmt(a.mg, 1).replace(/\s/g, "")};${Math.round(a.mg * UMOL)};${q(a.note || "")}\n`; });
  if (from || to) c += `\nPériode : ${from ? frDate(from) : "début"} au ${to ? frDate(to) : "aujourd'hui"}\n`;
  c += "Données saisies par l'utilisateur, à titre indicatif.\n";
  return {csv:c, n:an.length};
}

function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.appendChild(s); }); }
async function loadPdfLib(){
  if (!window.jspdf) await loadScript("vendor/jspdf.umd.min.js");
  if (!window.autoTable) await loadScript("vendor/jspdf.plugin.autotable.min.js");
  if (!window.jspdf || typeof window.autoTable !== "function") throw new Error("load");
  return window.jspdf.jsPDF;
}
/* polices PDF standard : Latin-1 uniquement */
const pdfT = s => String(s ?? "").replace(/[  ]/g, " ").replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/œ/g, "oe").replace(/Œ/g, "OE")
  .replace(/…/g, "...").replace(/[–—]/g, "-").replace(/≥/g, ">=").replace(/≤/g, "<=").replace(/⇄/g, "<->").replace(/[^\x09\x0a\x0d\x20-\x7e\xa0-\xff]/g, "");
async function buildPdf(p, from, to, detail){

  const N = isos.length;
  const entered = isos.filter(i => hasMeals(p.days[i])), partsArr = entered.map(i => sumDay(p, p.days[i]));
  const ans = p.analyses.filter(a => a.date >= from && a.date <= to).sort((a, b) => a.date.localeCompare(b.date));
  const avg = partsArr.length ? partsArr.reduce((s, v) => s + v, 0) / partsArr.length : 0;
  const who = [p.prenom, p.nom].filter(Boolean).join(" ") || "Profil";

  // en-tête

  doc.setFillColor(...ACC); doc.rect(0, 0, W, 4, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(...INK); T("Carnet de suivi phénylcétonurie", M, y);
  y += 7; doc.setFontSize(12); T(who + (p.naissance ? `, né(e) le ${frDate(p.naissance)} (${age(p.naissance)})` : ""), M, y);
  y += 6; doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...MUT);
  T(`Période du ${frDate(from)} au ${frDate(to)} (${N} jours) · édité le ${frDate(t)} avec PhéCompte`, M, y);
  y += 5; T(`Zone cible : ${p.seuilMin != null ? `${fmtVal(p.seuilMin, u)} à ${fmtVal(p.seuilMax, u)} ${unitLabel(u)}` : "non renseignée"} · Objectif : ${p.objectif ? fmt(p.objectif) + " parts/jour" : "non renseigné"} · 1 part = ${PART_MG} mg de Phé`, M, y);
  y += 5; T("Produits hypoprotéinés AGEPS : grammes et calories seulement, aucune part de Phé comptée (consigne).", M, y);
  if (p.poids || kcalTarget(p)){ y += 5; T(`Poids : ${p.poids ? fmt(p.poids) + " kg" + (p.poidsDate ? " (pesé le " + frDate(p.poidsDate) + ")" : "") : "non renseigné"}${kcalTarget(p) ? ` · Cible calorique : ${fmt(p.kcalKg)} kcal/kg/j = ${fmt(kcalTarget(p), 0)} kcal/j` : ""}`, M, y); }

  const over = p.objectif ? partsArr.filter(v => v > p.objectif).length : null;
  const st = entered.map(i => dayStats(p, p.days[i])), avgH = st.length ? st.reduce((s, x) => s + x.hg, 0) / st.length : 0;
  const kDays = st.filter(x => x.kn), avgK = kDays.length ? kDays.reduce((s, x) => s + x.kc, 0) / kDays.length : 0;
  const boxes = [["Jours saisis", `${entered.length} / ${N}`], [partsArr.length ? `Moyenne (${fmt(Math.min(...partsArr), 1)} à ${fmt(Math.max(...partsArr), 1)})` : "Moyenne", `${fmt(avg, 1)} parts/j`], ["Jours > objectif", over == null ? "–" : String(over)], ["Prises de sang", String(ans.length)], ["Hypoprotéinés moy./j", `${fmt(avgH, 0)} g`], ["Calories moy./j*", kDays.length ? `${fmt(avgK, 0)} kcal` : "–"]];

    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...INK); T(v, x + bw / 2, y + 7.5, {align:"center"});
    doc.setFont("helvetica", "normal"); doc.setFontSize(6.5); doc.setTextColor(...MUT); T(l, x + bw / 2, y + 12.5, {align:"center"});

    if (N <= 45) isos.forEach((i, k) => { if (new Date(i + "T12:00").getDay() === 1 && i.slice(8) !== "01"){ const x = X(k, x0, w); doc.line(x, yb, x, yb + 0.8); T(String(+i.slice(8)), x, yb + 4.2, {align:"center"}); } });

    for (let v = 0; v <= vmax + 1e-9; v += stepV){ const yy = yt + h - v / vmax * h; doc.line(x0, yy, x0 + w, yy); T(fmt(v, dec), x0 - 1.5, yy + 1, {align:"right"}); }

  doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...MUT); T("Barres : parts du jour · trait pointillé : objectif · triangle : note du jour", W - M, y, {align:"right"});
  y += 3;
  const h1 = 38;

  // 2. Phé sanguine
  doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...INK); T(`Phé sanguine (${unitLabel(u)})`, M, y);
  doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...MUT); T("Bande verte : zone cible", W - M, y, {align:"right"});

    else { tot += v; out.textContent = `${fmt(v / PART_MG)} part${v / PART_MG > 1 ? "s" : ""} · ${fmt(v, 0)} mg`; out.style.color = ""; }

function chooseImport(d){

      if (x.dataset.imp === "remplacer" && !x.dataset.ok){ x.dataset.ok = 1; x.textContent = "Confirmer : remplacer tout"; return; } apply(x.dataset.imp); })));

/* ---------- synchronisation Google Drive (fichier dans le Drive de l'utilisateur) ----------
   Connexion OAuth « jeton » par redirection, sans serveur : portée drive.file (l'application ne voit que le fichier qu'elle a créé).
   Google limite le jeton à 1 h : il est renouvelé sans action (redirection prompt=none) à l'ouverture de l'application.
   Chaque synchronisation fusionne (mergeDb) le fichier et ce téléphone, puis renvoie le résultat : rien n'est écrasé. */
const GOOGLE_CLIENT_ID = "912776231128-rifi5bdst0utt471463qa9ch4vkqaskh.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_KEY = "phecompte.drive", DRIVE_NAME = "PhéCompte - synchronisation.json";
const DRIVE_REDIRECT = (() => { try { const u = new URL("index.html", location.href); return u.origin + u.pathname; } catch(e){ return ""; } })();
const driveAvailable = () => !!GOOGLE_CLIENT_ID && !framed && /^https?:$/.test(location.protocol);
let DS; try { DS = JSON.parse(localStorage.getItem(DRIVE_KEY) || "null") || {}; } catch(e){ DS = {}; }
const driveSave = () => { try { localStorage.setItem(DRIVE_KEY, JSON.stringify(DS)); } catch(e){} };
const driveTokenOk = () => !!(DS.on && DS.token && DS.exp && Date.now() < DS.exp - 120000);
let driveBusy = false, driveAgain = false, driveTimer = null, drivePending = false;

function driveAuth(mode){
  const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { sessionStorage.setItem("phecompte.oauth", JSON.stringify({state, mode, back:location.hash})); } catch(e){}
  if (mode === "silent"){ DS.lastSilent = Date.now(); driveSave(); }
  const q = new URLSearchParams({client_id:GOOGLE_CLIENT_ID, redirect_uri:DRIVE_REDIRECT, response_type:"token", scope:DRIVE_SCOPE,
    include_granted_scopes:"true", state, prompt: mode === "silent" ? "none" : "select_account"});
  if (DS.email) q.set("login_hint", DS.email);
  location.assign("https://accounts.google.com/o/oauth2/v2/auth?" + q);
}
/* retour de Google : #access_token=…&expires_in=…&state=…  ou  #error=…&state=… */
function driveCatchRedirect(){
  const h = location.hash.slice(1);
  if (!/(^|&)(access_token|error)=/.test(h)) return;
  const r = new URLSearchParams(h); let saved = null;
  try { saved = JSON.parse(sessionStorage.getItem("phecompte.oauth") || "null"); sessionStorage.removeItem("phecompte.oauth"); } catch(e){}
  history.replaceState(null, "", location.pathname + location.search + (saved && saved.back || ""));
  if (!saved || r.get("state") !== saved.state) return;
  if (r.get("access_token")){
    DS.on = true; DS.token = r.get("access_token"); DS.exp = Date.now() + (+r.get("expires_in") || 3600) * 1000; DS.needLogin = false; DS.err = "";
    driveSave(); if (saved.mode !== "silent") ui.driveJustOn = true;
  } else if (saved.mode === "silent"){ DS.needLogin = true; DS.token = ""; driveSave(); }
  else if (r.get("error") !== "access_denied" || !DS.on){ /* refus à l'activation : rien à faire */ }
}
/* renouvellement automatique : seulement si rien n'est en cours de saisie, et au plus une fois toutes les 10 minutes */
function driveRenewIfNeeded(){
  if (!driveAvailable() || !DS.on || DS.needLogin || driveTokenOk() || !navigator.onLine) return false;
  if (document.getElementById("sheetRoot").children.length || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return false;
  if (DS.lastSilent && Date.now() - DS.lastSilent < 10 * 60000) return false;
  driveAuth("silent"); return true;
}
async function gapi(url, opt = {}){
  const r = await fetch(url, {...opt, headers:{...(opt.headers || {}), Authorization:"Bearer " + DS.token}});
  if (r.status === 401){ DS.token = ""; DS.exp = 0; driveSave(); throw Object.assign(new Error("Connexion Google expirée"), {auth:true}); }
  if (r.status === 404 && opt.allow404) return null;
  if (!r.ok) throw new Error("Google Drive a répondu " + r.status);
  return r;
}
const canon = v => Array.isArray(v) ? "[" + v.map(canon).join(",") + "]" : v && typeof v === "object" ? "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}" : JSON.stringify(v ?? null);
async function driveFindFile(){
  const q = encodeURIComponent("appProperties has { key='phecompte' and value='sync' } and trashed=false");
  const r = await (await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime desc&fields=files(id)`)).json();
  return r.files && r.files[0] ? r.files[0].id : null;
}
async function driveSync(){
  if (!driveAvailable() || !driveTokenOk()) return;
  if (driveBusy){ driveAgain = true; return; }
  if (document.getElementById("sheetRoot").children.length || /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || "")){ drivePending = true; return; }
  driveBusy = true; drivePending = false;
  try {
    if (!DS.email){ try { const a = await (await gapi("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)")).json(); DS.email = a.user && a.user.emailAddress || ""; } catch(e){ if (e.auth) throw e; } }
    let id = DS.fileId, remote = null;
    if (id){ const r = await gapi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, {allow404:true}); if (r) remote = await r.json().catch(() => null); else id = null; }
    if (!id){ id = await driveFindFile(); if (id) remote = await (await gapi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json().catch(() => null); }
    let next = db, remoteCanon = null;
    if (remote && Array.isArray(remote.profiles) && remote.profiles.length){
      const {app, version, exportedAt, syncedAt, ...rd} = remote; migrateAll(rd); remoteCanon = canon(rd);
      next = hasRealData(db) ? mergeDb(db, rd) : {...rd, current: rd.profiles.some(p => p.id === rd.current) ? rd.current : rd.profiles[0].id};
    }
    if (canon(next) !== canon(db)){
      if (document.getElementById("sheetRoot").children.length){ drivePending = true; return; }   // une saisie a commencé entre-temps
      applyMerged(next); render();
    }
    if (hasRealData(db) && canon(db) !== remoteCanon){
      const body = JSON.stringify({app:"PhéCompte", version:2, syncedAt:new Date().toISOString(), ...db});
      if (id) await gapi(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body});
      else {
        const meta = {name:DRIVE_NAME, mimeType:"application/json", appProperties:{phecompte:"sync"}}, bd = "pc" + Date.now();
        const mp = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
        id = (await (await gapi("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {method:"POST", headers:{"Content-Type":"multipart/related; boundary=" + bd}, body:mp})).json()).id;
      }
    }
    DS.fileId = id; DS.lastSync = new Date().toISOString(); DS.err = ""; driveSave();
  } catch(e){
    DS.err = e.auth ? "" : (navigator.onLine ? e.message : "Hors connexion"); driveSave();
  } finally {
    driveBusy = false;
    if (ui.tab === "profil" && !document.getElementById("sheetRoot").children.length && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) render();
    if (driveAgain){ driveAgain = false; driveSync(); }
  }
}
function driveSoon(){ if (!DS.on) return; clearTimeout(driveTimer); driveTimer = setTimeout(driveSync, 1500); }
function driveOff(){
  if (DS.token) fetch("https://oauth2.googleapis.com/revoke?token=" + encodeURIComponent(DS.token), {method:"POST"}).catch(() => {});
  DS = {}; driveSave();
}
function driveCard(){
  if (!driveAvailable()) return "";
  if (!DS.on) return `<section class="card"><div class="label">Synchronisation entre appareils</div>
    <p class="small" style="margin:0">Saisissez le midi sur un téléphone et le soir sur un autre : avec la synchronisation, chaque appareil retrouve automatiquement les saisies des autres. Les données sont rangées dans <b>votre</b> Google Drive, dans un seul fichier ; l'application n'a accès à rien d'autre.</p>
    <button class="btn primary block" data-act="driveOn">Activer avec mon compte Google</button>
    <p class="small muted" style="margin:0">À faire une fois sur chaque appareil, avec le même compte Google.</p></section>`;
  const st = DS.needLogin ? `<span style="color:var(--mid)">Reconnexion à Google nécessaire.</span>`
    : DS.err ? `<span style="color:var(--mid)">Dernier essai : ${esc(DS.err)}.</span>`
    : DS.lastSync ? `Dernière synchronisation ${ago(DS.lastSync)}.` : "Première synchronisation en attente.";
  return `<section class="card"><div class="label">Synchronisation entre appareils</div>
    <p class="small" style="margin:0">Activée${DS.email ? ` avec <b>${esc(DS.email)}</b>` : ""}. ${st}</p>
    ${DS.needLogin || !driveTokenOk() ? `<button class="btn primary block" data-act="driveLogin">Se reconnecter à Google</button>` : `<button class="btn block" data-act="driveNow">Synchroniser maintenant</button>`}
    <button class="btn ghost block" data-act="driveOff">Désactiver sur cet appareil</button></section>`;
}
