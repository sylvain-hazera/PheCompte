name: Déployer le service Cloudflare
# Déploie worker/ (recettes anonymes et trouvailles) sur Cloudflare Workers + D1.
# Secrets GitHub nécessaires : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TURNSTILE_SECRET, ADMIN_TOKEN
# Récapitulatif e-mail (facultatif) : BREVO_API_KEY, NOTIFY_FROM (adresse d'expédition vérifiée chez Brevo), NOTIFY_EMAILS (destinataires, séparés par des virgules)
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml", "src/data.js", "scripts/gen_worker_aliments.py"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier les secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN manquant"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID manquant"; exit 1; }
      - name: Base D1 (création si besoin)
        run: |
          W="npx --yes wrangler@3.112.0"
          ID=$($W d1 list --json | jq -r '.[] | select(.name=="phecompte") | .uuid')
          if [ -z "$ID" ]; then $W d1 create phecompte; ID=$($W d1 list --json | jq -r '.[] | select(.name=="phecompte") | .uuid'); fi
          test -n "$ID" || { echo "::error::Base D1 introuvable"; exit 1; }
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          $W d1 execute phecompte --remote --file=schema.sql
      - name: Base d'aliments pour le calcul des recettes
        working-directory: .
        run: python3 scripts/gen_worker_aliments.py
      - name: Déployer
        run: npx --yes wrangler@3.112.0 deploy
      - name: Secrets du service
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for S in TURNSTILE_SECRET ADMIN_TOKEN BREVO_API_KEY NOTIFY_EMAILS NOTIFY_FROM; do
            V="${!S}"
            if [ -n "$V" ]; then printf '%s' "$V" | npx --yes wrangler@3.112.0 secret put "$S"; else echo "::warning::Secret $S absent : fonction correspondante désactivée"; fi
          done
      - name: Vérifier le service en ligne
        working-directory: .
        run: |
          U=https://phecompte-api.sylvain-hazera.workers.dev
          sleep 5
          curl -fsS "$U/sante"; echo
          curl -fsS -H "Origin: https://sylvain-hazera.github.io" -D - -o /tmp/t.json "$U/trouvailles" | grep -i "access-control-allow-origin"
          python3 -c "import json;d=json.load(open('/tmp/t.json'));print('trouvailles :',len(d['trouvailles']))"
          curl -fsS -H "Origin: https://sylvain-hazera.github.io" "$U/recettes" | python3 -c "import json,sys;print('recettes validées :',len(json.load(sys.stdin)['recettes']))"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Origin: https://sylvain-hazera.github.io" -H "Content-Type: application/json" -d '{"token":"faux","item":{"product":"Test","prot":1,"ou":"magasin","store":"Test","city":"Test"}}' "$U/trouvailles")
          echo "Envoi sans vérification anti-robot -> HTTP $code (403 attendu)"; test "$code" = "403"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" -d '{}' "$U/admin/trouvailles/abcdefabcdef")
          echo "Modération sans mot de passe -> HTTP $code (401 attendu)"; test "$code" = "401"
